name: Generate Multi‑Style Snake

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG (multi‑style)
        uses: Pro-Bandey/multi-style-snake-contribution-grid@main
        with:
          username: ${{ github.repository_owner }}
          output_dir: dist
          style: blocks         # opções: blocks, rounds, triangles, stars, diamonds
          color_scheme: dark    # dark ou light

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          force_orphan: true
